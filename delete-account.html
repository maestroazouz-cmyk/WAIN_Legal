<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>حذف الحساب والبيانات - تطبيق وين (Wain)</title>
    <!-- خط تجوال الحديث -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <!-- مكتبة Supabase الرسمية عبر CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --primary: #0F172A;
            --danger: #EF4444;
            --accent: #F97316;
            --bg: #F8FAFC;
            --card: #FFFFFF;
            --text: #1E293B;
            --text-sec: #64748B;
            --border: #E2E8F0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 24px 16px; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; max-width: 520px; width: 100%; padding: 32px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
        .logo-box { text-align: center; margin-bottom: 24px; }
        .logo-title { font-size: 26px; font-weight: 800; color: var(--primary); }
        .logo-sub { color: var(--text-sec); font-size: 14px; margin-top: 6px; }
        .warning-box { background: #FEF2F2; border: 1px solid #FCA5A5; border-radius: 12px; padding: 14px; color: #991B1B; font-size: 13px; margin-bottom: 24px; line-height: 1.6; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 14px; font-weight: 700; margin-bottom: 8px; color: var(--primary); }
        input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: 10px; font-size: 15px; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: var(--accent); }
        .btn-delete { width: 100%; background: var(--danger); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
        .btn-delete:hover { opacity: 0.9; }
        .btn-delete:disabled { opacity: 0.5; cursor: not-allowed; }
        .status-msg { margin-top: 18px; padding: 12px; border-radius: 10px; font-size: 14px; text-align: center; display: none; }
        .status-success { background: #ECFDF5; color: #065F46; border: 1px solid #A7F3D0; }
        .status-error { background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-box">
        <div class="logo-title">تطبيق وين | WAIN</div>
        <div class="logo-sub">بوابة طلب حذف الحساب والبيانات الشخصية</div>
    </div>

    <div class="warning-box">
        ⚠️ <strong>تنبيه هام:</strong> سيؤدي تأكيد الحذف إلى مسح ملفك الشخصي، جميع إعلاناتك، المحادثات، والإشعارات بشكل نهائي ولا يمكن التراجع عن هذه العملية.
    </div>

    <form id="deleteAccountForm">
        <div class="form-group">
            <label for="userEmail">البريد الإلكتروني المسجل:</label>
            <input type="email" id="userEmail" required placeholder="example@domain.com">
        </div>

        <div class="form-group">
            <label for="userPassword">كلمة المرور:</label>
            <input type="password" id="userPassword" required placeholder="أدخل كلمة المرور لتأكيد ملكية الحساب">
        </div>

        <button type="submit" id="submitBtn" class="btn-delete">تأكيد وحذف الحساب نهائياً</button>
    </form>

    <div id="statusBox" class="status-msg"></div>
</div>

<script>
    // إعدادات Supabase الخاصة بمشروع وين
    const SUPABASE_URL = "https://mhbajeqzcwgkqrgtceac.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_ouDNoRcyPKhKmYYnMAoRSA_-Hg0ylUm";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById('deleteAccountForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusBox = document.getElementById('statusBox');

    function showStatus(message, isError = false) {
        statusBox.style.display = 'block';
        statusBox.className = 'status-msg ' + (isError ? 'status-error' : 'status-success');
        statusBox.innerHTML = message;
    }

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('userEmail').value.trim().toLowerCase();
        const password = document.getElementById('userPassword').value;

        if (!confirm("هل أنت متأكد تماماً من رغبتك في حذف حسابك وكافة بياناتك؟")) {
            return;
        }

        submitBtn.disabled = true;
        submitBtn.innerText = "جاري التحقق وحذف البيانات...";
        statusBox.style.display = 'none';

        try {
            // 1. التحقق من الحساب وتسجيل الدخول
            const { data: authData, error: authError } = await supabase.auth.signInWithPassword({
                email: email,
                password: password
            });

            if (authError || !authData.user) {
                throw new Error("بيانات الدخول غير صحيحة أو الحساب غير موجود. يرجى التأكد والمحاولة ثانية.");
            }

            const userId = authData.user.id;

            // 2. حذف البيانات المرتبطة بالمستخدم في الجداول
            await supabase.from('favorites').delete().eq('user_id', userId);
            await supabase.from('notifications').delete().eq('user_id', userId);
            await supabase.from('user_devices').delete().eq('user_id', userId);
            await supabase.from('properties').delete().eq('owner_id', userId);
            await supabase.from('users').delete().eq('user_id', userId);

            // 3. استدعاء إجراء حذف الحساب وتسجيل الخروج
            await supabase.auth.signOut();

            showStatus("✅ تم حذف حسابك وكافة بياناتك بنجاح من قاعدة البيانات.", false);
            form.style.display = 'none';

        } catch (err) {
            showStatus(err.message || "حدث خطأ أثناء محاولة حذف الحساب.", true);
            submitBtn.disabled = false;
            submitBtn.innerText = "تأكيد وحذف الحساب نهائياً";
        }
    });
</script>

</body>
</html>
